<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập Lớp 6 - 9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Đăng nhập Client-Side -->
        <section id="auth-screen" class="auth-box">
            <h2 id="auth-title">Đăng Nhập Local</h2>
            <div class="auth-notice">⚠️ Dữ liệu chỉ lưu trên thiết bị này.</div>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <input type="text" id="auth-user" placeholder="Tên của bạn..." required autocomplete="username">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Vào Học Ngay</button>
            </form>
        </section>

        <!-- Màn hình Chính -->
        <section id="main-screen" class="hidden">
            <nav class="tabs">
                <button class="tab-btn active" onclick="switchTab('study')">Luyện Tập</button>
                <button class="tab-btn" onclick="switchTab('leaderboard')">BXH Thiết Bị</button>
                <button class="btn btn-danger" onclick="logout()" style="margin-left: auto;">Thoát</button>
            </nav>

            <!-- TAB LUYỆN TẬP -->
            <article id="tab-study">
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 0.85rem; font-weight: bold;">Khối Lớp:</label>
                        <select id="grade-select" onchange="renderSubjects()">
                            <option value="6">Lớp 6</option>
                            <option value="7">Lớp 7</option>
                            <option value="8">Lớp 8</option>
                            <option value="9">Lớp 9</option>
                        </select>
                    </div>

                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 0.85rem; font-weight: bold;">Số câu làm:</label>
                        <select id="question-count-select">
                            <option value="5">5 Câu (Nhanh)</option>
                            <option value="10" selected>10 Câu (Chuẩn)</option>
                            <option value="15">15 Câu</option>
                            <option value="all">Tất cả câu</option>
                        </select>
                    </div>
                </div>

                <div id="subject-list" class="subject-grid"></div>
            </article>

            <!-- TAB BẢNG XẾP HẠNG & SAO LƯU -->
            <article id="tab-leaderboard" class="hidden">
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="btn btn-secondary" onclick="exportData()" style="flex:1;">📥 Tải Sao Lưu</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()" style="flex:1;">📤 Nhập Sao Lưu</button>
                    <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
                </div>

                <h3 style="margin-bottom: 10px;">Top Học Sinh Trên Máy Này</h3>
                <!-- Bảng xếp hạng bọc thẻ table-responsive chống rớt khung trên mobile -->
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Hạng</th>
                                <th>Tài khoản</th>
                                <th>ĐTB (Quy đổi)</th>
                                <th>Số bài</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body"></tbody>
                    </table>
                </div>
            </article>
        </section>

        <!-- MÀN HÌNH LÀM BÀI -->
        <section id="quiz-screen" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="quiz-title">Bài Thi</h3>
                <div id="quiz-timer" style="font-weight: bold; color: var(--warning);">15:00</div>
            </div>

            <div id="question-container">
                <div class="question-text" id="question-text">---</div>
                <div id="answer-box"></div>
            </div>

            <div id="hint-box" class="hint-box hidden" style="margin-top:15px; padding:10px; background: rgba(245,158,11,0.1); color:#fcd34d; border-radius:6px;">
                💡 <strong>Gợi ý:</strong> <span id="hint-text"></span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;">
                <button class="btn btn-warning" onclick="toggleHint()">Gợi Ý</button>
                <button class="btn btn-primary" id="next-btn" onclick="submitAnswer()">Tiếp theo</button>
            </div>
        </section>

        <!-- MÀN HÌNH XEM LẠI ĐÁP ÁN SAI -->
        <section id="review-screen" class="hidden">
            <h2>Kết Quả & Xem Lại Đáp Án</h2>
            <div id="review-summary" style="margin: 15px 0; font-size: 1.1rem;"></div>
            <div id="review-list"></div>
            <button class="btn btn-primary" onclick="exitReview()" style="width: 100%; margin-top: 15px;">Quay Về Trang Chủ</button>
        </section>
    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
