<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập & Giải Mã ARG</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (Dùng CDN chính thức) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <main class="container">
        <!-- ĐĂNG NHẬP / ĐĂNG KÝ KIỂU ROBLOX -->
        <section id="auth-screen" class="auth-box">
            <h2 id="auth-title">Đăng Nhập Roblox Style</h2>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <input type="text" id="auth-user" placeholder="Tên tài khoản (Cho phép @!-_)" required style="margin-bottom: 10px;">
                <input type="password" id="auth-pass" placeholder="Mật khẩu (Ít nhất 6 ký tự)" required style="margin-bottom: 15px;">
                
                <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="width: 100%;">Đăng Nhập</button>
            </form>

            <div style="margin-top: 15px; font-size: 0.9rem;">
                <a href="#" id="auth-toggle-btn" onclick="toggleAuthMode()" style="color: var(--primary);">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
        </section>

        <!-- MÀN HÌNH CHÍNH -->
        <section id="main-screen" class="hidden">
            <nav class="tabs">
                <button class="tab-btn active" onclick="switchTab('study')">Luyện Tập</button>
                <button class="tab-btn" onclick="switchTab('leaderboard')">BXH Toàn Cầu</button>
                <button class="btn btn-danger" onclick="logout()" style="margin-left: auto;">Thoát (<span id="user-display"></span>)</button>
            </nav>

            <article id="tab-study">
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 0.85rem; font-weight: bold;">Khối Lớp / Cấp độ:</label>
                        <select id="grade-select" onchange="renderSubjects()">
                            <option value="6">Lớp 6</option>
                            <option value="7">Lớp 7</option>
                            <option value="8">Lớp 8</option>
                            <option value="9">Lớp 9</option>
                        </select>
                    </div>

                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 0.85rem; font-weight: bold;">Số câu ngẫu nhiên:</label>
                        <select id="question-count-select">
                            <option value="10" selected>10 Câu</option>
                            <option value="20">20 Câu</option>
                            <option value="50">50 Câu (Thử thách)</option>
                        </select>
                    </div>
                </div>

                <div id="subject-list" class="subject-grid"></div>
            </article>

            <article id="tab-leaderboard" class="hidden">
                <h3 style="margin-bottom: 10px;">Top Học Sinh / Master ARG (Global)</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Hạng</th>
                                <th>Tài khoản</th>
                                <th>ĐTB (Thang 10)</th>
                                <th>Bài đã làm</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body"></tbody>
                    </table>
                </div>
            </article>
        </section>

        <!-- MÀN HÌNH BÀI THI & REVIEW -->
        <section id="quiz-screen" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="quiz-title">Bài Thi</h3>
                <div id="quiz-timer" style="font-weight: bold; color: var(--warning);">15:00</div>
            </div>

            <div id="question-container">
                <div class="question-text" id="question-text"></div>
                <div id="answer-box"></div>
            </div>

            <div id="hint-box" class="hint-box hidden" style="margin-top:15px; padding:10px; background: rgba(245,158,11,0.1); color:#fcd34d; border-radius:6px;">
                💡 <strong>Gợi ý:</strong> <span id="hint-text"></span>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 20px; gap: 10px;">
                <button class="btn btn-warning" onclick="toggleHint()">Gợi Ý</button>
                <button class="btn btn-primary" id="next-btn" onclick="submitAnswer()">Tiếp theo</button>
            </div>
        </section>

        <section id="review-screen" class="hidden">
            <h2>Kết Quả & Đáp Án</h2>
            <div id="review-summary" style="margin: 15px 0; font-size: 1.1rem;"></div>
            <div id="review-list"></div>
            <button class="btn btn-primary" onclick="exitReview()" style="width: 100%; margin-top: 15px;">Về Trang Chủ</button>
        </section>
    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
