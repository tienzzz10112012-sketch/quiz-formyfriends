<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3301 // RANDOMIZED CIPHER QUIZ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080c10;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            width: 100%;
            max-width: 700px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
        }
        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #58a6ff;
            font-weight: bold;
        }
        .question-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #c9d1d9;
            line-height: 1.5;
        }
        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: #161b22;
            border: 1px solid #30363d;
            color: #00ff66;
            padding: 12px 15px;
            text-align: left;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #21262d;
            border-color: #58a6ff;
        }
        .option-btn.selected {
            background: #1f6feb;
            color: #ffffff;
            border-color: #58a6ff;
        }
        .actions {
            display: flex;
            justify-content: space-between;
        }
        button.nav-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button.nav-btn:hover { background: #2ea043; }
        button:disabled { background: #30363d; cursor: not-allowed; }
        
        /* Result Screen */
        .result-screen { display: none; text-align: center; }
        .score-box { font-size: 2rem; color: #58a6ff; margin: 20px 0; }
        .rank-title { font-size: 1.2rem; color: #d29922; margin-bottom: 20px; }
        .restart-btn { background: #1f6feb; color: #fff; border: none; padding: 12px 25px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-box">
        <div class="header">
            <span>[3301 // DECODER TEST]</span>
            <span id="progress">CÂU 1 / 10</span>
        </div>

        <div class="question-title" id="q-text">Đang tải câu hỏi...</div>

        <div class="options-grid" id="options-container">
            <!-- Các nút phương án sẽ render tự động ở đây -->
        </div>

        <div class="actions">
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>CÂU TIẾP TEO ></button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>[KẾT QUẢ ĐÁNH GIÁ NĂNG LỰC]</h2>
        <div class="score-box" id="score-text">0 / 10</div>
        <div class="rank-title" id="rank-text">Đang xếp hạng...</div>
        <button class="restart-btn" onclick="startQuiz()">⚡ CHƠI LẠI (XÁO TRỘN MỚI)</button>
    </div>
</div>

<script>
    // Ngân hàng 10 câu hỏi Mật mã & Trí tuệ
    const rawQuestions = [
        {
            q: "Mật mã Caesar dịch chuyển chữ cái 'A' lùi 3 bước (A->D, B->E). Hỏi từ 'CAT' mã hóa thành gì?",
            options: ["FDW", "ECV", "DBU", "GBX"],
            answer: 0
        },
        {
            q: "Mã nhị phân '01000001' đại diện cho chữ cái nào trong bảng mã ASCII?",
            options: ["A", "B", "C", "Z"],
            answer: 0
        },
        {
            q: "Trong thế giới mạng, cổng (Port) mặc định của giao thức bảo mật HTTPS là bao nhiêu?",
            options: ["443", "80", "22", "8080"],
            answer: 0
        },
        {
            q: "Cicada 3301 rất tôn thờ các Số Nguyên Tố. Dãy số nào sau đây TOÀN LÀ SỐ NGUYÊN TỐ?",
            options: ["2, 3, 5, 7, 11", "1, 3, 5, 7, 9", "2, 4, 6, 8, 10", "3, 5, 9, 11, 13"],
            answer: 0
        },
        {
            q: "Chuỗi mã hóa 'Q0lDQURB' đang sử dụng phương thức mã hóa phổ biến nào?",
            options: ["Base64", "MD5", "RSA", "ROT13"],
            answer: 0
        },
        {
            q: "Kỹ thuật giấu thông điệp mật bên trong một bức ảnh hoặc file âm thanh gọi là gì?",
            options: ["Steganography", "Cryptography", "Phishing", "Brute Force"],
            answer: 0
        },
        {
            q: "Trong mã Morse, ký hiệu '... --- ...' đại diện cho thông điệp khẩn cấp nào?",
            options: ["SOS", "HELP", "EXIT", "STOP"],
            answer: 0
        },
        {
            q: "Hệ thống mã hóa bất đối xứng nổi tiếng (dùng khóa Public và Private) dựa trên phép nhân số nguyên tố tên là gì?",
            options: ["RSA", "AES", "DES", "SHA-256"],
            answer: 0
        },
        {
            q: "Mật mã Vigenère thuộc loại mật mã nào?",
            options: ["Mật mã thay thế đa bảng (Polyalphabetic)", "Mật mã nhị phân", "Mật mã dịch chuyển đơn", "Mật mã khối (Block Cipher)"],
            answer: 0
        },
        {
            q: "Địa chỉ IP Loopback mặc định của máy cục bộ (Localhost) là gì?",
            options: ["127.0.0.1", "192.168.1.1", "8.8.8.8", "10.0.0.1"],
            answer: 0
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;

    // Thuật toán xáo trộn Fisher-Yates shuffle
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startQuiz() {
        currentIndex = 0;
        score = 0;
        
        // 1. Randomize vị trí CÂU HỎI
        currentQuestions = shuffleArray(rawQuestions).map(q => {
            // 2. Randomize vị trí CÁC PHƯƠNG ÁN A, B, C, D trong từng câu
            const correctAnswerText = q.options[q.answer];
            const shuffledOptions = shuffleArray(q.options);
            const newAnswerIndex = shuffledOptions.indexOf(correctAnswerText);
            return {
                q: q.q,
                options: shuffledOptions,
                answer: newAnswerIndex
            };
        });

        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        showQuestion();
    }

    function showQuestion() {
        selectedOption = null;
        document.getElementById('next-btn').disabled = true;
        
        const q = currentQuestions[currentIndex];
        document.getElementById('progress').innerText = `CÂU ${currentIndex + 1} / 10`;
        document.getElementById('q-text').innerText = `${currentIndex + 1}. ${q.q}`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.onclick = () => selectOption(idx, btn);
            container.appendChild(btn);
        });

        if (currentIndex === currentQuestions.length - 1) {
            document.getElementById('next-btn').innerText = 'XEM KẾT QUẢ';
        } else {
            document.getElementById('next-btn').innerText = 'CÂU TIẾP TEO >';
        }
    }

    function selectOption(index, btn) {
        selectedOption = index;
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        if (selectedOption === currentQuestions[currentIndex].answer) {
            score++;
        }

        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('score-text').innerText = `${score} / 10`;

        let rank = "";
        if (score === 10) rank = "🏆 CẤP ĐỘ: MASTER CIPHER GOD (100% Chính xác!)";
        else if (score >= 7) rank = "⚡ CẤP ĐỘ: SENIOR HACKER (Tư duy rất tốt!)";
        else if (score >= 5) rank = "🔍 CẤP ĐỘ: CIPHER NOVICE (Đạt mức Trung bình)";
        else rank = "⚠️ CẤP ĐỘ: AMATEUR (Cần luyện tập thêm Mật mã học)";

        document.getElementById('rank-text').innerText = rank;
    }

    // Khởi chạy ngay khi mở trang
    startQuiz();
</script>

</body>
</html>
