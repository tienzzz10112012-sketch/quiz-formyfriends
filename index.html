<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3301 // TRIỆU PHÚ KIẾN THỨC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080c10;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            width: 100%;
            max-width: 700px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
            text-align: center;
        }
        h1, h2 { color: #58a6ff; margin-bottom: 15px; }
        .grid-cate {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-cate, .btn-opt {
            background: #161b22;
            border: 1px solid #30363d;
            color: #00ff66;
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            font-weight: bold;
        }
        .btn-cate:hover, .btn-opt:hover {
            background: #21262d;
            border-color: #58a6ff;
            color: #fff;
        }
        .btn-opt.selected { background: #1f6feb; color: #fff; }
        .options-grid { display: grid; gap: 12px; margin: 20px 0; text-align: left; }
        .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .nav-btn { background: #238636; color: #fff; border: none; padding: 12px 20px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .nav-btn:disabled { background: #30363d; cursor: not-allowed; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="box">
    <!-- MÀN CHỌN LĨNH VỰC -->
    <div id="cate-screen">
        <h1>[AI LÀ TRIỆU PHÚ // KHOA HỌC]</h1>
        <p style="color:#c9d1d9;">Chọn lĩnh vực sở trường của bạn để bắt đầu thử thách 5 câu hỏi:</p>
        
        <div class="grid-cate">
            <button class="btn-cate" onclick="selectCategory('math')">📐 TOÁN HỌC</button>
            <button class="btn-cate" onclick="selectCategory('science')">🧪 KHTN (LÝ - HÓA - SINH)</button>
            <button class="btn-cate" onclick="selectCategory('literature')">📖 NGỮ VĂN & LỊCH SỬ</button>
            <button class="btn-cate" onclick="selectCategory('tech')">💻 TIN HỌC & ARG CIPHER</button>
        </div>
    </div>

    <!-- MÀN CHƠI GAME -->
    <div id="game-screen" class="hidden">
        <div style="display:flex; justify-content:space-between; color:#8b949e; margin-bottom:15px;">
            <span id="cate-title">LĨNH VỰC: ...</span>
            <span id="progress">CÂU 1/5</span>
        </div>
        
        <h3 id="q-text" style="color:#c9d1d9; line-height:1.5; text-align:left;">Đang tải câu hỏi...</h3>

        <div class="options-grid" id="options-container"></div>

        <div class="actions">
            <button class="nav-btn" onclick="backToMenu()" style="background:#da3633;">❌ ĐỔI NGÀNH</button>
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>CÂU TIẾP TEO ></button>
        </div>
    </div>

    <!-- MÀN KẾT QUẢ -->
    <div id="result-screen" class="hidden">
        <h2>[KẾT QUẢ THỬ THÁCH]</h2>
        <div style="font-size: 2.5rem; color: #58a6ff; margin: 15px 0;" id="score-text">0 / 5</div>
        <p id="rank-text" style="color: #d29922; font-size: 1.1rem; margin-bottom: 20px;"></p>
        <button class="nav-btn" onclick="backToMenu()">🔄 CHỌN LĨNH VỰC KHÁC</button>
    </div>
</div>

<script>
    // Ngân hàng câu hỏi phân theo Lĩnh vực
    const database = {
        math: [
            { q: "Đạo hàm của hàm số y = x^2 tại x = 3 bằng bao nhiêu?", options: ["6", "3", "9", "12"], answer: 0 },
            { q: "Số Pi (π) xấp xỉ bằng bao nhiêu?", options: ["3.14159", "3.12159", "3.16159", "3.18159"], answer: 0 },
            { q: "Tổng các góc trong một tam giác bằng bao nhiêu độ?", options: ["180°", "360°", "90°", "270°"], answer: 0 },
            { q: "Số nguyên tố nhỏ nhất là số nào?", options: ["2", "1", "0", "3"], answer: 0 },
            { q: "Công thức tính diện tích hình tròn có bán kính R là gì?", options: ["πR²", "2πR", "πR", "4πR²"], answer: 0 }
        ],
        science: [
            { q: "Nguyên tố hóa học nào có ký hiệu là 'Au'?", options: ["Vàng", "Bạc", "Đồng", "Nhôm"], answer: 0 },
            { q: "Vận tốc ánh sáng trong chân không xấp xỉ bằng bao nhiêu?", options: ["300.000 km/s", "150.000 km/s", "1.000.000 km/s", "30.000 km/s"], answer: 0 },
            { q: "Bào quan nào được coi là 'nhà máy năng lượng' của tế bào?", options: ["Ti thể (Mitochondria)", "Nhân tế bào", "Lưới nội chất", "Bộ máy Golgi"], answer: 0 },
            { q: "Hành tinh nào gần Mặt Trời nhất trong Hệ Mặt Trời?", options: ["Sao Thủy", "Sao Kim", "Sao Hỏa", "Trái Đất"], answer: 0 },
            { q: "Khí nào chiếm tỷ lệ nhiều nhất trong không khí Trái Đất?", options: ["Nitơ (N2)", "Oxy (O2)", "Cacbonic (CO2)", "Argon"], answer: 0 }
        ],
        literature: [
            { q: "Tác phẩm 'Truyện Kiều' do ai sáng tác?", options: ["Nguyễn Du", "Chế Lan Viên", "Xuân Diệu", "Đoàn Thị Điểm"], answer: 0 },
            { q: "Chiến thắng Điện Biên Phủ lừng lẫy năm châu diễn ra vào năm nào?", options: ["1954", "1945", "1975", "1968"], answer: 0 },
            { q: "Nhà thơ nào được mệnh danh là 'Ông hoàng thơ tình' Việt Nam?", options: ["Xuân Diệu", "Hàn Mặc Tử", "Huy Cận", "Nghuyễn Bính"], answer: 0 },
            { q: "Trận chiến trên sông Bạch Đằng năm 938 do ai lãnh đạo?", options: ["Ngô Quyền", "Lê Hoàn", "Trần Hưng Đạo", "Lý Thường Kiệt"], answer: 0 },
            { q: "Thành phố Sóc Trăng nổi tiếng với lễ hội đua ghe Ngo truyền thống của dân tộc nào?", options: ["Khmer", "Kinh", "Hoa", "Chăm"], answer: 0 }
        ],
        tech: [
            { q: "Mật mã Caesar dịch lùi 3 bước chữ 'A' thành chữ gì?", options: ["D", "E", "F", "B"], answer: 0 },
            { q: "Port mặc định của web bảo mật HTTPS là gì?", options: ["443", "80", "22", "8080"], answer: 0 },
            { q: "Địa chỉ IP Localhost chuẩn là gì?", options: ["127.0.0.1", "192.168.1.1", "8.8.8.8", "1.1.1.1"], answer: 0 },
            { q: "Kỹ thuật giấu tin mật vào ảnh/audio gọi là gì?", options: ["Steganography", "Cryptography", "Brute Force", "Phishing"], answer: 0 },
            { q: "Chuỗi mã hóa kết thúc bằng dấu '=' thường là chuẩn mã hóa nào?", options: ["Base64", "MD5", "Hex", "Morse"], answer: 0 }
        ]
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;

    function shuffle(arr) {
        let a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function selectCategory(cate) {
        const titles = { math: 'TOÁN HỌC', science: 'KHTN', literature: 'NGỮ VĂN & LỊCH SỬ', tech: 'TIN HỌC & ARG' };
        document.getElementById('cate-title').innerText = 'LĨNH VỰC: ' + titles[cate];
        
        // Randomize vị trí CÂU HỎI & ĐÁP ÁN
        currentQuestions = shuffle(database[cate]).map(q => {
            const correctText = q.options[q.answer];
            const shuffledOpt = shuffle(q.options);
            return {
                q: q.q,
                options: shuffledOpt,
                answer: shuffledOpt.indexOf(correctText)
            };
        });

        currentIndex = 0;
        score = 0;
        
        document.getElementById('cate-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        selectedOption = null;
        document.getElementById('next-btn').disabled = true;
        
        const q = currentQuestions[currentIndex];
        document.getElementById('progress').innerText = `CÂU ${currentIndex + 1}/5`;
        document.getElementById('q-text').innerText = `${currentIndex + 1}. ${q.q}`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.onclick = () => {
                selectedOption = idx;
                document.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('next-btn').disabled = false;
            };
            container.appendChild(btn);
        });

        document.getElementById('next-btn').innerText = (currentIndex === 4) ? 'XEM KẾT QUẢ' : 'CÂU TIẾP TEO >';
    }

    function nextQuestion() {
        if (selectedOption === currentQuestions[currentIndex].answer) score++;
        currentIndex++;
        if (currentIndex < 5) {
            showQuestion();
        } else {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = `${score} / 5`;
            
            let rank = "";
            if (score === 5) rank = "🥇 TRIỆU PHÚ KHOA HỌC (Đỉnh cao tuyệt đối!)";
            else if (score >= 3) rank = "🥈 HỌC SƯU TẦM (Trình độ khá tốt)";
            else rank = "🥉 TẬP SỰ (Cần ôn lại bài gấp!)";
            
            document.getElementById('rank-text').innerText = rank;
        }
    }

    function backToMenu() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('cate-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
